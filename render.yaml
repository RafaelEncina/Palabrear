services:
  - type: web
    name: palabrear
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    healthCheckPath: /salud
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Cuando tengas dominio propio, descomenta esto: se usa como URL canonica
      # y redirige palabrear.onrender.com -> palabrear.com.
      # - key: URL_PUBLICA
      #   value: https://palabrear.com
